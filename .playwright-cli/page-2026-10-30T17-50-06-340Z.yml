        - generic [ref=e409]: COMMON INQUIRIES
        - heading "Frequently Asked Questions" [level=2] [ref=e410]
        - paragraph [ref=e411]: Everything you need to know about team formations, logistics, rules, and hardware support.
      - generic [ref=e412]:
        - generic [ref=e413]:
          - button "What is BUCC NEXUS and who is organizing it? +" [ref=e414] [cursor=pointer]:
            - generic [ref=e415]: What is BUCC NEXUS and who is organizing it?
            - generic [ref=e416]: +
          - paragraph [ref=e417]: BUCC NEXUS is a proposed 48-hour student innovation hackathon conceptualized by the BRAC University Computer Club (BUCC), the largest and most active student computing organization at BRAC University. It brings together undergraduate developers, designers, and problem solvers to build functional prototypes across four specialized tracks.
        - generic [ref=e418]:
          - button "Can students from non-CSE departments participate? +" [ref=e419] [cursor=pointer]:
            - generic [ref=e420]: Can students from non-CSE departments participate?
            - generic [ref=e421]: +
          - paragraph [ref=e422]: Yes! Interdisciplinary teams are highly encouraged. Students from Electrical & Electronic Engineering (EEE), Architecture, Mathematics, Business, and Biotechnology bring vital perspectives in hardware design, interface usability, and business viability.
        - generic [ref=e423]:
          - button "What is the team size limit? +" [ref=e424] [cursor=pointer]:
            - generic [ref=e425]: What is the team size limit?
            - generic [ref=e426]: +
          - paragraph [ref=e427]: Teams must consist of 2 to 4 currently enrolled undergraduate BRAC University students. Individual solo applications will be placed into a team-formation mixer session prior to kickoff.
        - generic [ref=e428]:
          - button "Can we bring pre-written code or existing projects? +" [ref=e429] [cursor=pointer]:
            - generic [ref=e430]: Can we bring pre-written code or existing projects?
            - generic [ref=e431]: +
          - paragraph [ref=e432]: No. All core application logic, database schemas, and hardware integrations must be authored during the official 48-hour hackathon window. You may utilize open-source libraries, publicly available APIs, pre-trained AI foundation models, and standard UI component kits (e.g. Tailwind, Radix).
        - generic [ref=e433]:
          - button "Will hardware components be provided for the Robotics & IoT track? +" [ref=e434] [cursor=pointer]:
            - generic [ref=e435]: Will hardware components be provided for the Robotics & IoT track?
            - generic [ref=e436]: +
          - paragraph [ref=e437]: Teams are encouraged to bring their own microcontrollers (e.g., Arduino, ESP32, Raspberry Pi) and sensor modules. BUCC will maintain a backup hardware depot with common breadboards, jumpers, sensors, and power supplies for loan during the sprint.
        - generic [ref=e438]:
          - button "Is there a registration fee? +" [ref=e439] [cursor=pointer]:
            - generic [ref=e440]: Is there a registration fee?
            - generic [ref=e441]: +
          - paragraph [ref=e442]: Priority interest registration is completely free. Any nominal fee for lab security and swag kit subsidization will be announced upon official university approval.
      - generic [ref=e443]:
